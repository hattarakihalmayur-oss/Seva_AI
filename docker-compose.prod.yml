# ─────────────────────────────────────────────────────────────────────────────
# BharatSeva AI — Docker Compose (Production)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env or CI/CD secrets):
#   MONGODB_URI, JWT_SECRET, SARVAM_API_KEY, VITE_API_BASE_URL
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: bharatseva_mongo_prod
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bharatseva
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - bharatseva_network
    # No ports exposed — not accessible from outside the network

  # ── Backend (Express API) ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: bharatseva_backend_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - bharatseva_network
    # Ulimits for production stability
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ── Frontend (Nginx) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_NAME: BharatSeva AI
        VITE_APP_VERSION: 1.0.0
    container_name: bharatseva_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bharatseva_network

# ── Persistent Volumes ────────────────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  bharatseva_network:
    driver: bridge
